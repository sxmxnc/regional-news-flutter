name: regional_news_app
description: Bilingual news reader with an offline demo
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^3.4.3

  http: ^1.6.0

  shared_preferences: ^2.5.5

  flutter_html: ^3.0.0

  url_launcher: ^6.3.2

  share_plus: ^13.3.0

  html: 0.15.5

  flutter_secure_storage: ^11.2.0

  path_provider: ^2.1.6

  pdfrx: ^2.6.1

  package_info_plus: ^10.2.1

  device_info_plus: ^13.2.0

  firebase_core: ^4.15.0

  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  html: 0.15.5


flutter:

  uses-material-design: true

  assets:
    - lib/i18n/de.json
    - lib/i18n/pl.json

  fonts:
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans-Variable.ttf
        - asset: assets/fonts/OpenSans-Italic-Variable.ttf
          style: italic
